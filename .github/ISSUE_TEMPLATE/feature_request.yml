name: Feature request
description: Suggest a codec, backend, workflow, or interface improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware or FFmpeg backend
      description: Leave blank if the request is backend-independent.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
