name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev --group build

      - name: Run checks
        shell: pwsh
        run: |
          uv run --frozen --group dev ruff format --check src tests scripts
          uv run --frozen --group dev ruff check src tests scripts
          uv run --frozen python -m unittest discover -s tests -v

      - name: Validate release version and generate categorized notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (
            uv run --frozen python -c `
              'from video_compressor import __version__; print(__version__)'
          ).Trim()
          if ("v$packageVersion" -ne '${{ github.ref_name }}') {
            throw (
              "Tag ${{ github.ref_name }} does not match package version " +
              "$packageVersion."
            )
          }
          $releaseNotes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          uv run --frozen python scripts/generate_release_notes.py `
            --version '${{ github.ref_name }}' `
            --output $releaseNotes
          Get-Content -LiteralPath $releaseNotes -Raw -Encoding UTF8

      - name: Install FFmpeg full build
        shell: pwsh
        run: choco install ffmpeg-full --version=8.1.2 --no-progress -y

      - name: Build Full and Lite Nuitka executables
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem `
            -LiteralPath 'C:\ProgramData\chocolatey\lib\ffmpeg-full\tools' `
            -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.DirectoryName -match '[\\/]bin$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) {
            throw 'Unable to locate the Chocolatey FFmpeg binary.'
          }
          .\scripts\build_windows.ps1 `
            -Mode OneFile `
            -Edition Both `
            -FfmpegPath $ffmpeg

      - name: Verify release packages
        shell: pwsh
        run: .\scripts\verify_release.ps1 -ArtifactRoot .\artifacts

      - name: Upload Full build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Universal-Video-Compressor-Windows-Full
          if-no-files-found: error
          path: |
            artifacts/full/onefile/VideoCompressor-Full.exe
            artifacts/full/onefile/README.md
            artifacts/full/onefile/README.zh-CN.md
            artifacts/full/onefile/LICENSE.txt
            artifacts/full/onefile/THIRD_PARTY_NOTICES.md
            artifacts/full/onefile/FFmpeg-GPLv3-LICENSE.txt
            artifacts/full/onefile/SHA256SUMS.txt

      - name: Upload Lite build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Universal-Video-Compressor-Windows-Lite
          if-no-files-found: error
          path: |
            artifacts/lite/onefile/VideoCompressor-Lite.exe
            artifacts/lite/onefile/README.md
            artifacts/lite/onefile/README.zh-CN.md
            artifacts/lite/onefile/LICENSE.txt
            artifacts/lite/onefile/THIRD_PARTY_NOTICES.md
            artifacts/lite/onefile/SHA256SUMS.txt

      - name: Attest tagged release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/release/VideoCompressor-Full.exe
            artifacts/release/VideoCompressor-Lite.exe
            artifacts/release/Universal-Video-Compressor-Windows-Full.zip
            artifacts/release/Universal-Video-Compressor-Windows-Lite.zip
            artifacts/release/README.md
            artifacts/release/README.zh-CN.md
            artifacts/release/LICENSE.txt
            artifacts/release/THIRD_PARTY_NOTICES.md
            artifacts/release/FFmpeg-GPLv3-LICENSE.txt
            artifacts/release/SHA256SUMS.txt
