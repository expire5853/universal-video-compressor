name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev --group build

      - name: Run checks
        shell: pwsh
        run: |
          uv run --frozen --group dev ruff format --check src tests scripts
          uv run --frozen --group dev ruff check src tests scripts
          uv run --frozen python -m unittest discover -s tests -v

      - name: Install FFmpeg full build
        shell: pwsh
        run: choco install ffmpeg-full --version=8.1.2 --no-progress -y

      - name: Build Full and Lite Nuitka executables
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem `
            -LiteralPath 'C:\ProgramData\chocolatey\lib\ffmpeg-full\tools' `
            -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.DirectoryName -match '[\\/]bin$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) {
            throw 'Unable to locate the Chocolatey FFmpeg binary.'
          }
          .\scripts\build_windows.ps1 `
            -Mode OneFile `
            -Edition Both `
            -FfmpegPath $ffmpeg

      - name: Verify Full and Lite editions
        shell: pwsh
        run: |
          $builds = @(
            [pscustomobject]@{
              Edition = 'Full'
              Executable = '.\artifacts\full\onefile\VideoCompressor-Full.exe'
              Bundled = $true
              Language = 'en'
            }
            [pscustomobject]@{
              Edition = 'Lite'
              Executable = '.\artifacts\lite\onefile\VideoCompressor-Lite.exe'
              Bundled = $false
              Language = 'zh_CN'
            }
          )

          foreach ($build in $builds) {
            $exe = (Resolve-Path $build.Executable).Path
            $diagnostics = Join-Path `
              $env:RUNNER_TEMP `
              "diagnostics-$($build.Edition.ToLowerInvariant()).json"
            $arguments = (
              "--language $($build.Language) " +
              "--diagnostics-report=`"$diagnostics`" --self-test"
            )
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList $arguments `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$($build.Edition) self-test failed with exit code $($process.ExitCode)."
            }
            if (-not (Test-Path -LiteralPath $diagnostics -PathType Leaf)) {
              throw "$($build.Edition) edition did not produce diagnostics."
            }

            $report = Get-Content -LiteralPath $diagnostics -Raw -Encoding UTF8 |
              ConvertFrom-Json
            if ($report.error) {
              throw "$($build.Edition) diagnostics failed: $($report.error)"
            }
            $actualBundled = [bool]$report.resolved_tools.bundled
            if ($actualBundled -ne $build.Bundled) {
              throw "$($build.Edition) resolved the wrong FFmpeg source."
            }
            if ($report.language -ne $build.Language) {
              throw "$($build.Edition) did not use $($build.Language)."
            }
          }

      - name: Upload Full build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Video-Compressor-Windows-Full
          if-no-files-found: error
          path: |
            artifacts/full/onefile/VideoCompressor-Full.exe
            artifacts/full/onefile/README.md
            artifacts/full/onefile/README.zh-CN.md
            artifacts/full/onefile/LICENSE.txt
            artifacts/full/onefile/FFmpeg-GPLv3-LICENSE.txt
            artifacts/full/onefile/SHA256SUMS.txt

      - name: Upload Lite build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Video-Compressor-Windows-Lite
          if-no-files-found: error
          path: |
            artifacts/lite/onefile/VideoCompressor-Lite.exe
            artifacts/lite/onefile/README.md
            artifacts/lite/onefile/README.zh-CN.md
            artifacts/lite/onefile/LICENSE.txt
            artifacts/lite/onefile/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/release/VideoCompressor-Full.exe
            artifacts/release/VideoCompressor-Lite.exe
            artifacts/release/README.md
            artifacts/release/README.zh-CN.md
            artifacts/release/LICENSE.txt
            artifacts/release/FFmpeg-GPLv3-LICENSE.txt
            artifacts/release/SHA256SUMS.txt
