name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run checks
        shell: pwsh
        run: |
          uv run --frozen --group dev ruff format --check src tests scripts
          uv run --frozen --group dev ruff check src tests scripts
          uv run --frozen python -m unittest discover -s tests -v

      - name: Install FFmpeg full build
        shell: pwsh
        run: choco install ffmpeg-full --version=8.1.2 --no-progress -y

      - name: Build Nuitka OneFile executable
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem `
            -LiteralPath 'C:\ProgramData\chocolatey\lib\ffmpeg-full\tools' `
            -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.DirectoryName -match '[\\/]bin$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) {
            throw 'Unable to locate the Chocolatey FFmpeg binary.'
          }
          .\scripts\build_windows.ps1 `
            -Mode OneFile `
            -FfmpegPath $ffmpeg

      - name: Verify compiled application
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\artifacts\onefile\VideoCompressor.exe').Path
          $diagnostics = Join-Path $env:RUNNER_TEMP 'diagnostics.json'
          $arguments = "--diagnostics-report=`"$diagnostics`" --self-test"
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList $arguments `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Compiled self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $diagnostics -PathType Leaf)) {
            throw 'Compiled application did not produce diagnostics.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Video-Compressor-Windows
          if-no-files-found: error
          path: |
            artifacts/onefile/VideoCompressor.exe
            artifacts/onefile/README.md
            artifacts/onefile/LICENSE.txt
            artifacts/onefile/FFmpeg-GPLv3-LICENSE.txt
            artifacts/onefile/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/onefile/VideoCompressor.exe
            artifacts/onefile/README.md
            artifacts/onefile/LICENSE.txt
            artifacts/onefile/FFmpeg-GPLv3-LICENSE.txt
            artifacts/onefile/SHA256SUMS.txt
