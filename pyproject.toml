[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "universal-video-compressor"
dynamic = ["version"]
description = "A Windows video compression workbench with runtime-verified CPU, GPU, and NPU capability detection."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["ffmpeg", "video", "compression", "hevc", "av1", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "PySide6==6.10.1",
]

[project.scripts]
video-compressor = "video_compressor.gui:main"

[dependency-groups]
dev = [
  "ruff==0.12.8",
]
build = [
  "Nuitka==4.1.3",
  "ordered-set==4.1.0",
  "Pillow==12.1.1",
  "zstandard==0.23.0",
]

[tool.hatch.version]
path = "src/video_compressor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/video_compressor"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
